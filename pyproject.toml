[project]
name = "qecdlp-cert"
version = "0.1.0"
description = "Verifiable resource certificates for public reversible arithmetic blocks in quantum ECDLP."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "jsonschema>=4.0.0",
  "pytest>=8.0.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["verifier*"]